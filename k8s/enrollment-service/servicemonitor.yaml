apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: enrollment-service-monitor
  namespace: valle-grande
  labels:
    app: enrollment-service
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: enrollment-service
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
