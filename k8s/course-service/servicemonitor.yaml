apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: course-service-monitor
  namespace: valle-grande
  labels:
    app: course-service
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: course-service
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
