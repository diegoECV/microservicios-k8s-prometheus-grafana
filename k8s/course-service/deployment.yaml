apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: valle-grande
  labels:
    app: course-service
    service: course-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
        service: course-service
    spec:
      containers:
        - name: course-service
          image: course-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: ARTIFICIAL_DELAY_MS
              value: "0"
            - name: SIMULATE_CRASH
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
